name: Öğrenci sitesini yayımla
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Öğrenci ekranını bağla
        env:
          SCRIPT_URL: ${{ vars.SCRIPT_URL }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          url = os.environ['SCRIPT_URL']
          assert re.fullmatch(r'https://script\.google\.com/(?:a/[^/]+/)?macros/s/[\w-]+/exec', url), 'SCRIPT_URL eksik veya geçersiz'
          p = pathlib.Path('docs/index.html')
          p.write_text(p.read_text().replace('__SCRIPT_URL__',url))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
